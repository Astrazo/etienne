[project]
name = "etienne"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Astrazo", email = "joshua.richardson@outlook.com.au" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "import-linter[ui]>=2.15",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "ruff>=0.16.8",
    "spotipy>=2.26.0",
    "typer>=0.27.2",
    "webcolors>=25.10.0",
]

[project.scripts]
etienne = "etienne:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
